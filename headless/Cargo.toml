[package]
# The edition without the GUI, for headless hosts. Its binary is `sapphire-journal`,
# the one command both editions put on PATH; the desktop app is
# `sapphire-journal-desktop`, and runs the same commands.
name = "sapphire-journal-headless"
edition.workspace = true
version = "0.15.0"
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "task-management", "notes", "cli", "mcp"]

[[bin]]
name = "sapphire-journal"
path = "src/main.rs"

[dependencies]
sapphire-journal-cli = { path = "../crates/sapphire-journal-cli", version = "0.15.0" }
clap.workspace = true
anyhow.workspace = true

# `cargo binstall sapphire-journal-headless` downloads the release file instead of building
# it, following sapphire-turtle/.github's README.md#conventions: the files are bare binaries
# named `<crate>-<os>-<arch>` — `sapphire-journal-headless-…`, beside the desktop app's
# `sapphire-journal-desktop-…` — so each release platform names its own; binstall installs
# it as the `sapphire-journal` binary. quick-install is a third party's build: only this
# repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
