[workspace]
members = [
    "cli",
    "crates/sapphire-journal-api",
    "crates/sapphire-journal-core",
    "desktop",
    "crates/sapphire-journal-mcp",
]
default-members = ["cli"]
resolver = "3"

[workspace.package]
description = "A task, event and note management app built on sapphire-framework - file-based, local-first, made for human-agent collaboration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/sapphire-journal"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
indexmap = { version = "2", features = ["serde"] }
# The MCP macros name `rmcp` directly, so it is the version sapphire-framework
# builds on (`sapphire_framework::mcp::rmcp`): 3.5 in sapphire-framework 0.23.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.0"
# The facade: `server` is the app server (AppServer, FrameworkCommand,
# SyncRuntime), `ipc` its transport, `mcp` the shared MCP tools with the `mcp`
# subcommand and `/mcp` over HTTP. `redb-store` must be named: with default
# features off the framework's persistent store silently falls back to
# in-memory otherwise.
sapphire-framework = { version = "0.23", default-features = false }
sapphire-workspace = { package = "sapphire-framework-workspace", version = "0.23", default-features = false }
sapphire-track = { package = "sapphire-framework-track", version = "0.23" }
sapphire-frontmatter = { package = "sapphire-framework-frontmatter", version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev.package."*"]
opt-level = 1
