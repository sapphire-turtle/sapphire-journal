[workspace]
members = [
    "cli",
    "crates/sapphire-journal-core",
    "desktop",
    "crates/sapphire-journal-mcp",
]
default-members = ["cli"]
resolver = "3"

[workspace.package]
description = "A task, event and note management app built on sapphire-framework - file-based, local-first, made for human-agent collaboration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fluo10/sapphire-journal"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
indexmap = { version = "2", features = ["serde"] }
# The MCP macros name `rmcp` directly, so it is the version sapphire-framework
# builds on (`sapphire_framework::mcp::rmcp`): 1.8 on sapphire-framework#233,
# below the 3.2 this repo had moved to; follow the framework when it moves.
rmcp = { version = "1.8", default-features = false, features = ["server", "macros"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.0"
# The facade: `server` is the app server (AppServer, FrameworkCommand,
# SyncRuntime), `ipc` its transport, `mcp` the shared MCP tools with the `mcp`
# subcommand and `/mcp` over HTTP. `redb-store` must be named: with default
# features off the framework's persistent store silently falls back to
# in-memory otherwise.
#
# Pinned to sapphire-framework#233 (MCP as a framework feature) until it is
# released; back to `version = "0.17"` then.
sapphire-framework = { git = "https://github.com/sapphire-turtle/sapphire-framework", branch = "feat/mcp-common", default-features = false }
# The bridge client an app server connects with. The facade's `bridge` module
# is the daemon side, so the client is a direct dependency at the same release.
sapphire-bridge-client = { package = "sapphire-framework-bridge-client", git = "https://github.com/sapphire-turtle/sapphire-framework", branch = "feat/mcp-common" }
sapphire-workspace = { package = "sapphire-framework-workspace", git = "https://github.com/sapphire-turtle/sapphire-framework", branch = "feat/mcp-common", default-features = false }
sapphire-track = { package = "sapphire-framework-track", git = "https://github.com/sapphire-turtle/sapphire-framework", branch = "feat/mcp-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev.package."*"]
opt-level = 1
