[package]
name = "sapphire-journal-desktop"
# Released together with `sapphire-journal-headless`, under its `v{version}`
# tags (release-plz.toml).
version = "0.16.0"
authors = ["fluo10 <fluo10@fireturtle.net>"]
edition.workspace = true
description.workspace = true
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "sapphire-journal-desktop"
path = "src/main.rs"

# The Windows console shim the package puts on `PATH` as `sapphire-journal.exe`
# (src/bin/console.rs).
[[bin]]
name = "sapphire-journal-console"
path = "src/bin/console.rs"
required-features = ["package"]

[features]
# The release workflow's build: the package's start, its updater, its first run
# and its service (src/package.rs). `cargo build` makes the plain binary.
package = ["sapphire-framework/package"]

[dependencies]
# Every command but the window — `serve`, `mcp`, `entry`, `status`, … — runs the
# CLI's own code, so this one binary does all the CLI does.
sapphire-journal-cli  = { path = "../crates/sapphire-journal-cli", version = "0.16.0" }
# The entry types the server's answers deserialize into, and the methods'
# parameters and names. The window reads nothing from the journal itself:
# it is a client of the `sapphire-journal` server.
sapphire-journal-core = { path = "../crates/sapphire-journal-core", version = "0.15.2" }
sapphire-journal-api  = { path = "../crates/sapphire-journal-api",  version = "5.0.0" }
sapphire-journal-mcp  = { path = "../crates/sapphire-journal-mcp", version = "0.4.2" }
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { workspace = true, features = ["eframe", "ipc", "server"] }
# The window's icon and app-menu entry (`LauncherSpec`'s icon), and whether this runs in a
# package; the framework's version of it.
corundum-framework-platform = "0.11.0"
# The period picker (alumina-datetime), in corundum's look; the version sapphire-framework uses.
corundum-framework-gui = { version = "0.11.0", default-features = false, features = ["datetime"] }
egui_extras = { version = "0.37", features = ["svg"] }
grain-id = { version = "0.15" }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
# The app icon in the Windows executable (`build.rs`).
corundum-framework-build = "0.11.0"

# The package (sapphire-turtle/.github's release-packager.yml, corundum-framework#103): the
# window's binary, built with the `package` feature; the release workflow adds the Windows
# console shim as `sapphire-journal.exe`. The product name is the launcher's (`LauncherSpec::name`),
# so the installer's shortcut and the launcher's entry coincide. The icons are rendered into
# `icons/` by the `icons` example before packaging.
[package.metadata.packager]
productName = "Sapphire Journal"
identifier = "org.sapphire-turtle.sapphire-journal"
category = "Productivity"
binaries = [{ path = "sapphire-journal-desktop", main = true }]
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]

# `cargo binstall --git https://github.com/sapphire-turtle/sapphire-journal sapphire-journal-desktop`
# downloads the release file instead of building it (this crate is not on crates.io), following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
