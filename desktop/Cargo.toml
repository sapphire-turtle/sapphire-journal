[package]
name = "sapphire-journal-desktop"
version = "0.2.0"
authors = ["fluo10 <fluo10@fireturtle.net>"]
edition.workspace = true
description.workspace = true
license-file = "LICENSE"
repository.workspace = true
publish = false

[dependencies]
# The entry types the server's answers deserialize into, and the methods'
# parameters and names. The desktop reads nothing from the journal itself:
# it is a client of the `sapphire-journal` server.
sapphire-journal-core = { path = "../crates/sapphire-journal-core", version = "0.13.0" }
sapphire-journal-api  = { path = "../crates/sapphire-journal-api",  version = "3.0.0" }
sapphire-journal-mcp  = { path = "../crates/sapphire-journal-mcp", version = "0.2.0" }
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { workspace = true, features = ["eframe", "ipc"] }
egui_extras = { version = "0.37", features = ["svg"] }
grain-id = { version = "0.15" }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
chrono = { workspace = true }
tracing = { workspace = true }

# `cargo binstall --git https://github.com/sapphire-turtle/sapphire-journal sapphire-journal-desktop`
# downloads the release file instead of building it (this crate is not on crates.io), following
# sapphire-framework's ci/README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/desktop-v{ version }/{ name }-windows-x86_64.exe"
