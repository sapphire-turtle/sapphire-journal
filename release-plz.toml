[workspace]
# The two editions — the headless one and the desktop app — share one version and
# one `v{version}` tag and GitHub release, which the headless one makes; the
# libraries are published without tags.
changelog_update = true
dependencies_update = true
publish = true
release = true
git_release_enable = false
git_tag_enable = false
# Publish only when a release PR is merged, not on every push to main that
# carries an unpublished version.
release_always = false
pr_branch_prefix = "release-plz/"
pr_labels = ["release"]

# The headless edition: the `sapphire-journal` binary without the GUI. A new crate
# at 0.15.0; 0.13.0 and 0.14.0 were published as `sapphire-journal`.
[[package]]
name = "sapphire-journal-headless"
version_group = "app"
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# The command line both editions run, and the app server it starts. They move
# with the editions: nothing outside this workspace builds on them. The CLI was
# the binary crate for 0.12.0, so this name resumes at 0.15.0.
[[package]]
name = "sapphire-journal-cli"
version_group = "app"

[[package]]
name = "sapphire-journal-server"
version_group = "app"

[[package]]
name = "sapphire-journal-core"

[[package]]
name = "sapphire-journal-mcp"

# The server's own API carries its own version: its major is the handshake's
# `app_api` (`API_VERSION`), so it is released only when the API breaks — like
# sapphire-framework-bridge-api and -server-api.
[[package]]
name = "sapphire-journal-api"

# The desktop app, which runs the CLI too. It is not published, so its versions
# live in the shared `v{version}` tags the headless edition makes; `git_only = true` is
# load-bearing: release-plz silently skips a crate whose Cargo.toml has
# `publish = false` unless it is set (`release = true` alone no longer does it).
[[package]]
name = "sapphire-journal-desktop"
version_group = "app"
git_only = true
# Overrides the workspace's `publish = true`, which `git_only` refuses.
publish = false
# The tag its version is read from; the headless edition makes it.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
