[package]
name = "sapphire-journal-mcp"
edition.workspace = true
version = "0.1.0"
description = "MCP tools for sapphire-journal: the journal's methods on its app server, and the tools that call them"
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["markdown", "task-management", "notes", "mcp"]

[lib]
path = "src/lib.rs"

[dependencies]
sapphire-journal-api = { path = "../sapphire-journal-api", version = "2.0.0" }
sapphire-journal-core = { path = "../sapphire-journal-core", version = "0.12.0", features = ["text-input"] }
sapphire-framework = { workspace = true, features = ["ipc", "mcp"] }
rmcp.workspace = true
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
