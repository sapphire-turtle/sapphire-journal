[package]
name = "sapphire-journal-cli"
edition.workspace = true
# Released together with the two editions that run it, `sapphire-journal-headless`
# and `sapphire-journal-desktop` (release-plz.toml).
version = "0.15.0"
description = "The command line of sapphire-journal's two editions, the headless one and the desktop app: its commands, the framework's and its own, which run the app server or call it"
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "task-management", "notes", "cli", "mcp"]

[dependencies]
sapphire-journal-core = { path = "../sapphire-journal-core", version = "0.14.0", features = ["text-input"] }
sapphire-journal-api  = { path = "../sapphire-journal-api",  version = "3.0.0" }
sapphire-journal-mcp  = { path = "../sapphire-journal-mcp", version = "0.3.0" }
sapphire-journal-server = { path = "../sapphire-journal-server", version = "0.15.0" }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
