[package]
name = "sapphire-journal-core"
edition.workspace = true
version = "0.12.0"
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["text-processing", "filesystem", "data-structures"]
keywords = ["markdown", "task-management", "notes", "frontmatter", "plain-text"]

[features]
# Text-frontend helpers: converters from CLI/MCP-style string inputs into the
# strongly-typed values consumed by `ops`. GUIs that build typed values
# directly from widgets should leave this disabled.
text-input = []

[dependencies]
serde.workspace = true
toml.workspace = true
chrono.workspace = true
indexmap.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
schemars.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
# `AppContext` only: search is the app server's, not this crate's.
sapphire-workspace.workspace = true
# `file_stamp`, for the entry cache's change detection.
sapphire-track.workspace = true
# Frontmatter YAML: the framework reads and writes it, not `serde_yaml`.
sapphire-frontmatter.workspace = true
grain-id = { version = "0.15", features = ["serde", "rusqlite", "schemars"] }

[dev-dependencies]
tempfile = "3"
