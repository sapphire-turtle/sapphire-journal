# Example user-level config for sapphire-journal.
#
# Location: $XDG_CONFIG_HOME/sapphire-journal/config.toml
#          (typically ~/.config/sapphire-journal/config.toml)
#
# This file holds host/machine-specific settings. It is intentionally separate
# from the per-journal `.sapphire-journal/config.toml` so that the same journal
# can be shared across machines.
#
# Embedding (semantic search) is not configured here: the host's
# `sapphire-bridge` runs one model for every app. See
# `sapphire-journal embedding show`. A `[cache.retrieve]` section left over
# from an older version is ignored.

# ── Periodic re-scan ─────────────────────────────────────────────────────────
# How often the server and the desktop app re-scan the entry cache, in minutes.
# Omit to use the default (10); set to 0 to disable.
sync_interval_minutes = 30
