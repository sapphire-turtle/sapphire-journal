name: Release binaries

# Builds the headless edition's and the desktop app's binaries for the four release
# platforms and attaches them to an existing `v{version}` release, which the
# two share. release-plz.yml calls it after a release; run it by hand to
# (re)upload the files for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.15.0).'
        required: true
        type: string

jobs:
  # Both binaries are `sapphire-journal` on PATH; the files are named by crate
  # to tell them apart.
  headless:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    # The signing key: each file with its `<file>.sig`, which `update` checks
    # (sapphire-turtle/sapphire-framework#402).
    secrets: inherit
    with:
      sign: true
      tag: ${{ inputs.tag }}
      package: sapphire-journal-headless
      binary: sapphire-journal
      asset: sapphire-journal-headless

  desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    # The signing key: each file with its `<file>.sig`, which `update` checks
    # (sapphire-turtle/sapphire-framework#402).
    secrets: inherit
    with:
      sign: true
      tag: ${{ inputs.tag }}
      package: sapphire-journal-desktop
      binary: sapphire-journal-desktop
      linux-packages: libwayland-dev libxkbcommon-dev

  # Sapphire Journal as a package (#357, #352), with sapphire-turtle/.github's
  # release-packager.yml: an installer per desktop OS, each signed with the organization's
  # minisign key, and the feed `sapphire-journal-latest.json` the installed app updates itself
  # from (desktop/src/package.rs reads this repository's latest release). The package holds
  # the desktop binary only, which runs the CLI too; the bare binaries above stay for servers,
  # the install script and `cargo binstall`. The macOS package is signed and notarized when
  # the repository has the MACOS_CERTIFICATE and APPLE_API_KEY secrets.
  package:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    # The signing key, and the macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-journal-desktop
      app-name: sapphire-journal
      features: package
      console-bin: sapphire-journal-console
      # One binary: the app server is its `serve` subcommand.
      command: sapphire-journal
      # The icons [package.metadata.packager] names, rendered from the app's SVG.
      pre-package: cargo run --release --locked -p sapphire-journal-desktop --example icons -- "$CRATE_DIR/icons"
