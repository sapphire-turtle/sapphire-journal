[package]
name = "sapphire-journal"
edition.workspace = true
version = "0.14.1"
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "task-management", "notes", "cli", "mcp"]

[lib]
name = "sapphire_journal"
path = "src/lib.rs"

[[bin]]
name = "sapphire-journal"
path = "src/main.rs"

[features]
default = ["redb-store"]
redb-store = ["sapphire-framework/redb-store"]

[dependencies]
sapphire-journal-core = { path = "../crates/sapphire-journal-core", version = "0.14.1", features = ["text-input"] }
sapphire-journal-api  = { path = "../crates/sapphire-journal-api",  version = "3.0.0" }
sapphire-journal-mcp  = { path = "../crates/sapphire-journal-mcp", version = "0.3.1" }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

# `cargo binstall sapphire-journal` downloads the release file instead of building it, following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
