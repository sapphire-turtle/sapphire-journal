[package]
name = "sapphire-journal"
edition.workspace = true
version = "0.13.0"
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "task-management", "notes", "cli", "mcp"]

[lib]
name = "sapphire_journal"
path = "src/lib.rs"

[[bin]]
name = "sapphire-journal"
path = "src/main.rs"

[features]
default = ["redb-store"]
redb-store = ["sapphire-framework/redb-store"]

[dependencies]
sapphire-journal-core = { path = "../crates/sapphire-journal-core", version = "0.13.0", features = ["text-input"] }
sapphire-journal-api  = { path = "../crates/sapphire-journal-api",  version = "2.0.0" }
sapphire-journal-mcp  = { path = "../crates/sapphire-journal-mcp", version = "0.2.0" }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
